spring.application.name=sbj-webhook
server.port=8080

spring.sql.init.mode=always
spring.h2.console.enabled=false

# ----- Proveedor: despachador de entregas -----
webhook.dispatch-interval-ms=1000
webhook.batch-size=50
webhook.request-timeout-ms=5000
# Intentos totales y espera exponencial entre ellos: 10 s, 20 s, 40 s... hasta 1 hora
webhook.max-attempts=8
webhook.backoff-base-ms=10000
webhook.backoff-max-ms=3600000
webhook.stale-claim-ms=60000
# Proteccion SSRF: false = solo destinos publicos. Esta en true porque el ejemplo se envia avisos a si mismo (localhost).
# EN PRODUCCION DEBE SER false.
webhook.allow-private-targets=true
webhook.rotation-grace-hours=24

# ----- Receptor -----
# Antiguedad maxima de un mensaje (segundos)
webhook.tolerance-seconds=300
# Secreto con el que el receptor de ejemplo verifica las firmas. Registra tu suscripcion con este mismo valor en "secret".
webhook.receiver-secret=${WEBHOOK_RECEIVER_SECRET:whsec_demo_secret_change_me_0123456789}
